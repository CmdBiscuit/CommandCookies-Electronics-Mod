plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

allprojects {
    group = 'com.commandcookie'
}

subprojects {
    plugins.withId('java') {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(21)
            withSourcesJar()
        }
        tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
        tasks.withType(AbstractArchiveTask).configureEach {
            preserveFileTimestamps = false
            reproducibleFileOrder = true
        }
    }
}

tasks.named('build') { dependsOn ':main:build', ':retro-expansion:build' }
tasks.named('check') { dependsOn ':main:check', ':retro-expansion:check' }
tasks.named('clean') { dependsOn ':main:clean', ':retro-expansion:clean' }
tasks.register('release', Sync) {
    group = 'build'
    description = 'Build both installable mod JARs and collect them in build/release.'
    dependsOn ':main:build', ':retro-expansion:build'
    from(project(':main').tasks.named('jar'))
    from(project(':retro-expansion').tasks.named('jar'))
    into layout.buildDirectory.dir('release')
}
